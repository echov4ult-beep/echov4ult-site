<style>
  :root{
    --bg:#03070c; --cyan:#2dd4ff; --cyan2:#7fe9ff; --deep:#0a96d6;
    --ink:#e6f2fb; --mut:#8aa3bd; --warm:#ffd9a0; --bad:#ff5a7a;
    --line:rgba(45,212,255,.18); --glow:0 0 30px rgba(45,212,255,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
     -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{background:
      radial-gradient(1200px 700px at 70% -10%, rgba(45,212,255,.12), transparent 60%),
      radial-gradient(1000px 600px at -10% 10%, rgba(10,150,214,.10), transparent 55%),
      var(--bg);
    color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  .hud{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;

  .hud .score{color:var(--cyan);font-size:26px;text-shadow:var(--glow)}
  .hud .best{color:var(--mut);font-size:13px;text-align:right;letter-spacing:2px;

  .screen.hide{display:none}

<body>
<canvas id="stage"></canvas>

<div class="hud">
  <div class="score" id="score">0</div>
  <div class="best" id="besthud">BEST 0</div>
</div>

<!-- START -->
<div class="screen" id="start">
  <img class="logo" src="assets/v-shield.png" alt="" onerror="this.style.display='none'">
  <div class="eyebrow">EchoV4ult Arcade</div>
  <h1>V4ULT <b>RUN</b></h1>
  <p class="sub">Drag to steer your shield. Dodge the red firewalls, grab the cyan data.</p>
  <p class="hint">Survive. It only gets faster.</p>
  <button class="btn" id="startBtn">START</button>
</div>

<!-- GAME OVER -->
<div class="screen hide" id="over">
  <div class="newbest" id="newbest">&nbsp;</div>
  <div class="biglabel">Score</div>
  <div class="big" id="finalScore">0</div>
  <div class="biglabel" style="margin-top:14px">Best</div>
  <div class="sub" style="font-family:'Orbitron',sans-serif;color:var(--cyan2);font-size:22px;margin-top:2px" id="finalBest">0</div>
  <button class="btn" id="retryBtn" style="margin-top:26px">RUN AGAIN</button>
</div>

<a class="back" href="/">← echov4ult.com</a>

<script>
(function(){
  "use strict";
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestHud = document.getElementById('besthud');
  const startScreen = document.getElementById('start');
  const overScreen = document.getElementById('over');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const newbest = document.getElementById('newbest');

  let W=0, H=0, DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const BEST_KEY = 'v4ult_run_best';
  let best = parseInt(localStorage.getItem(BEST_KEY)||'0',10) || 0;
  bestHud.textContent = 'BEST ' + best;

  // player
  const player = { x:W/2, y:0, r:20, tx:W/2 };
  let obstacles = [], orbs = [], particles = [], stars = [];
  let running=false, score=0, tick=0, spawnT=0, orbT=0, speed=0;

  // starfield backdrop
  function initStars(){
    stars = [];
    for(let i=0;i<60;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.6+0.4});
  }
  initStars();

  function reset(){
    obstacles=[]; orbs=[]; particles=[];
    score=0; tick=0; spawnT=0; orbT=0; speed=3.4;
    player.y = H - Math.max(120, H*0.18);
    player.x = W/2; player.tx = W/2;
    scoreEl.textContent = '0';
  }

  function start(){
    reset();
    startScreen.classList.add('hide');
    overScreen.classList.add('hide');
    running=true;
  }

  function gameOver(){
    running=false;
    burst(player.x, player.y, '#ff5a7a', 26);
    finalScore.textContent = score;
    if(score > best){
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      newbest.textContent = '★ New Best ★';
    } else {
      newbest.innerHTML = '&nbsp;';
    }
    finalBest.textContent = best;
    bestHud.textContent = 'BEST ' + best;
    setTimeout(()=>overScreen.classList.remove('hide'), 550);
  }

  function burst(x,y,color,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=Math.random()*4+1;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
    }
  }

  // ---- input: drag anywhere to steer ----
  function pointX(e){
    const t = e.touches ? e.touches[0] : e;
    return t.clientX;
  }
  function onMove(e){
    if(!running) return;
    e.preventDefault();
    player.tx = pointX(e);
  }
  cv.addEventListener('touchstart', onMove, {passive:false});
  cv.addEventListener('touchmove', onMove, {passive:false});
  cv.addEventListener('mousedown', e=>{ dragging=true; onMove(e); });
  window.addEventListener('mousemove', e=>{ if(dragging) onMove(e); });
  window.addEventListener('mouseup', ()=> dragging=false);
  let dragging=false;
  // block iOS double-tap zoom / bounce
  document.addEventListener('gesturestart', e=>e.preventDefault());
  document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);

  function spawnObstacle(){
    const w = Math.random()*(W*0.28) + W*0.14;
    const x = Math.random()*(W - w);
    obstacles.push({x, y:-40, w, h:26});
  }
  function spawnOrb(){
    orbs.push({x: Math.random()*(W-60)+30, y:-30, r:11});
  }

  function update(){
    tick++;
    // difficulty ramps with time
    speed += 0.0016;
    const spd = speed;

    // steer (smooth)
    player.x += (player.tx - player.x) * 0.35;
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));

    // spawn
    spawnT -= 1;
    const gap = Math.max(26, 62 - tick*0.02);
    if(spawnT<=0){ spawnObstacle(); spawnT = gap; }
    orbT -= 1;
    if(orbT<=0){ spawnOrb(); orbT = 70 + Math.random()*60; }

    // stars
    for(const s of stars){ s.y += s.s*spd*0.25; if(s.y>H){ s.y=0; s.x=Math.random()*W; } }

    // obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i]; o.y += spd;
      if(o.y > H+40){ obstacles.splice(i,1); score++; scoreEl.textContent=score; continue; }
      // circle-rect collision
      const cx=Math.max(o.x, Math.min(player.x, o.x+o.w));
      const cy=Math.max(o.y, Math.min(player.y, o.y+o.h));
      const dx=player.x-cx, dy=player.y-cy;
      if(dx*dx+dy*dy < player.r*player.r*0.72){ gameOver(); return; }
    }
    // orbs
    for(let i=orbs.length-1;i>=0;i--){
      const g=orbs[i]; g.y += spd*0.9;
      const dx=player.x-g.x, dy=player.y-g.y;
      if(dx*dx+dy*dy < (player.r+g.r)*(player.r+g.r)){
        orbs.splice(i,1); score+=5; scoreEl.textContent=score;
        burst(g.x,g.y,'#7fe9ff',10); continue;
      }
      if(g.y>H+30) orbs.splice(i,1);
    }
    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // stars
    for(const s of stars){
      ctx.globalAlpha = 0.4 + s.s*0.3;
      ctx.fillStyle = '#2dd4ff';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // orbs
    for(const g of orbs){
      ctx.beginPath();
      ctx.fillStyle = '#7fe9ff';
      ctx.shadowColor = '#2dd4ff'; ctx.shadowBlur = 18;
      ctx.arc(g.x, g.y, g.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;

    // obstacles (firewalls)
    for(const o of obstacles){
      const grad = ctx.createLinearGradient(0,o.y,0,o.y+o.h);
      grad.addColorStop(0,'#ff5a7a'); grad.addColorStop(1,'#b3243f');
      ctx.fillStyle = grad;
      ctx.shadowColor = 'rgba(255,90,122,.6)'; ctx.shadowBlur = 14;
      roundRect(o.x,o.y,o.w,o.h,7); ctx.fill();
    }
    ctx.shadowBlur = 0;

    // particles
    for(const p of particles){
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-2, p.y-2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // player shield
    if(running){
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.shadowColor = '#2dd4ff'; ctx.shadowBlur = 22;
      ctx.strokeStyle = '#7fe9ff'; ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(45,212,255,.15)';
      // shield hexagon
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = -Math.PI/2 + i*Math.PI/3;
        const px = Math.cos(a)*player.r, py = Math.sin(a)*player.r;
        i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // core
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#eafaff';
      ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(){
    if(running) update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
